name: Android Emulator Smoke Tests

# Isolated device-runtime lane; does not alter the standard APK release jobs.
permissions:
  contents: read

on:
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "feature/**"
      - "core/**"
      - "data/**"
      - "build-logic/**"
      - "gradle/**"
      - "scripts/sync-gradle-wrapper.sh"
      - ".github/workflows/android-emulator-smoke.yml"
  workflow_dispatch:

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Sync Gradle wrapper to latest stable
        run: |
          set -euo pipefail
          chmod +x gradlew
          bash ./scripts/sync-gradle-wrapper.sh

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 14 instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
