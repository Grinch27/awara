name: Build APK

# TODO(user): Decide whether release builds should keep running on every manual dispatch or move to tagged releases only.
# TODO(agent): If the latest stable Gradle moves ahead of AGP support, disable wrapper auto-sync before changing app code.
# TODO(agent): If compilation fails after the toolchain phase, the next research surface is the Compose and Accompanist dependency set.

permissions: write-all

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  repository_dispatch:
  workflow_dispatch:

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  build:
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        build_type: [debug, release]

    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Setup JDK
        uses: actions/setup-java@main
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main
        with:
          cache-cleanup: on-success

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@main

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Sync Gradle wrapper to latest stable
        run: |
          set -euo pipefail
          bash ./scripts/sync-gradle-wrapper.sh

      - name: Install Android 17 compile SDK
        run: |
          set -euo pipefail
          android_cli="$ANDROID_HOME/cmdline-tools/latest/bin/android"
          if [[ -x "${android_cli}" ]]; then
            "${android_cli}" --sdk="$ANDROID_HOME" sdk install \
              "platforms/android-37.0" "build-tools/36.0.0"
          else
            # TODO(agent): Remove this compatibility branch only after runner-images ships Android CLI.
            # Risk: GitHub-hosted runners can still provide sdkmanager without the android binary.
            # Verify: both runner and Docker compile SDK installation paths and fail closed on errors.
            echo "Android CLI unavailable on this runner; using existing sdkmanager compatibility path." >&2
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-37.0" "build-tools;36.0.0"
          fi

      - name: Run focused JVM regression tests
        if: matrix.build_type == 'debug'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Record Room migration schema
        if: matrix.build_type == 'debug'
        run: cat app/schemas/me.rerere.awara.di.AppDatabase/7.json

      - name: Build APK
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew --refresh-dependencies assemble${{ matrix.build_type == 'debug' && 'Debug' || 'Release' }} --stacktrace

      - name: Record actual resolved versions
        if: always()
        run: |
          mkdir -p build/reports/versions
          ./gradlew :app:reportResolvedVersions > build/reports/versions/report.log 2>&1 || cat build/reports/versions/report.log
          ./gradlew -p build-logic reportBuildPluginVersions > build/reports/versions/plugins.log 2>&1 || cat build/reports/versions/plugins.log
          cp -f build-logic/build/reports/versions/build-plugins.txt build/reports/versions/ 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: app-${{ matrix.build_type }}
          path: |
            app/build/outputs/apk/${{ matrix.build_type }}/*.apk
            app/build/reports/versions/
            build/reports/versions/
          compression-level: 9 # maximum compression
          retention-days: 30

      - name: Upload test results
        if: always() && matrix.build_type == 'debug'
        uses: actions/upload-artifact@main
        with:
          name: unit-test-results
          path: |
            app/schemas/
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
