name: Build APK

# TODO(user): Decide whether release builds should keep running on every manual dispatch or move to tagged releases only.
# TODO(agent): If the latest stable Gradle moves ahead of AGP support, disable wrapper auto-sync before changing app code.
# TODO(agent): If compilation fails after the toolchain phase, the next research surface is the Compose and Accompanist dependency set.

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        build_type: [debug, release]

    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Setup JDK
        uses: actions/setup-java@main
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main
        with:
          cache-cleanup: on-success

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@main

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Sync Gradle wrapper to latest stable
        run: |
          set -euo pipefail
          bash ./scripts/sync-gradle-wrapper.sh

      - name: Install Android 17 compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build APK
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew --refresh-dependencies assemble${{ matrix.build_type == 'debug' && 'Debug' || 'Release' }} --stacktrace

      - name: Record actual resolved versions
        if: always()
        run: |
          mkdir -p build/reports/versions
          ./gradlew :app:reportResolvedVersions > build/reports/versions/report.log 2>&1 || cat build/reports/versions/report.log
          ./gradlew -p build-logic reportBuildPluginVersions > build/reports/versions/plugins.log 2>&1 || cat build/reports/versions/plugins.log
          cp -f build-logic/build/reports/versions/build-plugins.txt build/reports/versions/ 2>/dev/null || true
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("build/reports/versions")
          root.mkdir(parents=True, exist_ok=True)
          apks = sorted(pathlib.Path("app/build/outputs/apk").glob("**/*.apk"))
          files = [{"file": str(p), "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "bytes": p.stat().st_size} for p in apks]
          data = {"utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "commit": os.environ.get("GITHUB_SHA", ""), "ref": os.environ.get("GITHUB_REF", ""),
                  "build_type": "${{ matrix.build_type }}", "java_home": os.environ.get("JAVA_HOME", ""),
                  "apks": files}
          (root/"build-info.json").write_text(json.dumps(data, indent=2, ensure_ascii=False)+"\n")
          (root/"checksums.sha256").write_text("".join(f'{a["sha256"]}  {a["file"]}\n' for a in files))
          PY

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: app-${{ matrix.build_type }}
          path: |
            app/build/outputs/apk/${{ matrix.build_type }}/*.apk
            app/build/reports/versions/
            build/reports/versions/
          compression-level: 9 # maximum compression
          retention-days: 30
