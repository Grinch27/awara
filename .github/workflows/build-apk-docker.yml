name: Build APK (Docker)

# TODO(user): Decide whether this containerized workflow should replace the default runner build or stay as a compatibility lane.
# TODO(agent): If Android SDK installation starts failing, first inspect the command line tools package URL and accepted license flow.
# TODO(agent): If the latest stable Gradle moves ahead of AGP support, disable wrapper auto-sync here before changing app code.

permissions: write-all

concurrency:
  group: build-apk-docker-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev
  repository_dispatch:
  workflow_dispatch:

env:
  CONTAINER_IMAGE: &container_image ubuntu:devel
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: "true"
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a
  FORCE_UNSAFE_CONFIGURE: "1"
  TZ: Etc/UTC
  DISPLAY_TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  GIT_TERMINAL_PROMPT: "0"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
      CONTAINER_IMAGE: ${{ env.CONTAINER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  build:
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    defaults:
      run:
        shell: bash
    container:
      image: *container_image
      options: &container_options >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
        --init
        --pids-limit=-1
        --shm-size=12g
        --ulimit nofile=1048576:1048576
      volumes: &container_volumes
        - /dev:/dev
        - /sys:/sys:rw
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Install system packages
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            openjdk-17-jdk-headless \
            openjdk-21-jdk-headless \
            python3 \
            unzip

      - name: Install Android SDK command line tools
        run: |
          set -euo pipefail
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/android-cmdline-tools.zip
          unzip -q /tmp/android-cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"

          # Android CLI replaces sdkmanager; avoid duplicate cmdline-tools/latest-2 installation.
          # SDK installation fails closed if required licenses have not been accepted.
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/android" --sdk="${ANDROID_SDK_ROOT}" sdk install \
            "build-tools/36.0.0" \
            "platform-tools" \
            "platforms/android-37.0"

      - name: Sync Gradle wrapper to latest stable
        run: |
          set -euo pipefail
          chmod +x gradlew
          bash ./scripts/sync-gradle-wrapper.sh

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
          PATH: /opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/usr/lib/jvm/java-21-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew --refresh-dependencies assembleDebug --stacktrace --no-daemon

      - name: Record actual resolved versions
        if: always()
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
        run: |
          set -e
          mkdir -p build/reports/versions
          ./gradlew :app:reportResolvedVersions > build/reports/versions/report.log 2>&1 || cat build/reports/versions/report.log
          ./gradlew -p build-logic reportBuildPluginVersions > build/reports/versions/plugins.log 2>&1 || cat build/reports/versions/plugins.log
          cp -f build-logic/build/reports/versions/build-plugins.txt build/reports/versions/ 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: app-debug-docker
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/versions/
            build/reports/versions/
          compression-level: 9
          retention-days: 30
