name: Build APK (Docker)

# TODO(user): Decide whether this containerized workflow should replace the default runner build or stay as a compatibility lane.
# TODO(agent): If Android SDK installation starts failing, first inspect the command line tools package URL and accepted license flow.
# TODO(agent): If the latest stable Gradle moves ahead of AGP support, disable wrapper auto-sync here before changing app code.

permissions:
  contents: read

concurrency:
  group: build-apk-docker-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ubuntu:devel
      options: >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
      volumes:
        - /dev:/dev
        - /sys:/sys:ro
        - /sys/fs/cgroup:/sys/fs/cgroup
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Install system packages
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            openjdk-17-jdk-headless \
            openjdk-21-jdk-headless \
            python3 \
            unzip

      - name: Install Android SDK command line tools
        run: |
          set -euo pipefail
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/android-cmdline-tools.zip
          unzip -q /tmp/android-cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"

          # sdkmanager exits as soon as it has enough answers, which would otherwise trip pipefail via yes(1).
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

          sdkmanager "cmdline-tools;latest"
          sdkmanager \
            "build-tools;36.0.0" \
            "platform-tools" \
            "platforms;android-37.0"

      - name: Sync Gradle wrapper to latest stable
        run: |
          set -euo pipefail
          chmod +x gradlew
          bash ./scripts/sync-gradle-wrapper.sh

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
          PATH: /opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/usr/lib/jvm/java-21-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew --refresh-dependencies assembleDebug --stacktrace --no-daemon

      - name: Record actual resolved versions
        if: always()
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
        run: |
          set -e
          mkdir -p build/reports/versions
          ./gradlew :app:reportResolvedVersions > build/reports/versions/report.log 2>&1 || cat build/reports/versions/report.log
          ./gradlew -p build-logic reportBuildPluginVersions > build/reports/versions/plugins.log 2>&1 || cat build/reports/versions/plugins.log
          cp -f build-logic/build/reports/versions/build-plugins.txt build/reports/versions/ 2>/dev/null || true
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          root = pathlib.Path("build/reports/versions")
          apks = sorted(pathlib.Path("app/build/outputs/apk").glob("**/*.apk"))
          files = [{"file": str(p), "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "bytes": p.stat().st_size} for p in apks]
          info = {"utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "commit": os.environ.get("GITHUB_SHA", ""), "ref": os.environ.get("GITHUB_REF", ""),
                  "build_type": "debug-docker", "apks": files}
          (root/"build-info.json").write_text(json.dumps(info, indent=2)+"\n")
          (root/"checksums.sha256").write_text("".join(f'{a["sha256"]}  {a["file"]}\n' for a in files))
          PY

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: app-debug-docker
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/versions/
            build/reports/versions/
          compression-level: 9
          retention-days: 30
